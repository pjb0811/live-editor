# pnpm settings live here rather than in .npmrc: npm warns about pnpm-only
# keys it finds there, and pnpm 11+ reads only auth and registry settings
# from .npmrc (#481).
#
# Kept intentionally: the docs website (website/, a separate Docusaurus app)
# builds @jbpark/ui-kit's un-bundled dist with webpack, which resolves ui-kit's
# externalized transitive deps (scheduler, @radix-ui/*, @tiptap/*, gsap, motion,
# ...) only via this flat layout. Removing it breaks `pnpm --dir website build`
# with a cascade of "Module not found" errors. An import of a hoisted package
# that isn't declared in package.json still resolves here, so CI's `knip` step
# is what reports it as an unlisted dependency (#282, #657).
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

# Dependencies allowed to run install scripts. pnpm 11+ fails an install on
# any script it hasn't been told about. esbuild's only checks its platform
# binary, which the optional @esbuild/* package already provides; it never ran
# under pnpm 10 either (#482).
allowBuilds:
  esbuild: false

# Our own packages install as soon as they're published. pnpm 11+ otherwise
# waits a day after any release (minimumReleaseAge), which would hold up the
# usual flow of publishing ui-kit/use-hooks and using it here right away.
minimumReleaseAgeExclude:
  - '@jbpark/*'

overrides:
  '@codemirror/state': ^6.7.1
  # @tiptap/extension-text-style (pulled in by @jbpark/ui-kit's RichTextEditor)
  # declares an exact peer on @tiptap/core matching its own version, and
  # @tiptap/core in turn pins an exact peer on @tiptap/pm — without this,
  # pnpm can leave older @tiptap/* packages hoisted instead, which breaks
  # module resolution for the mismatched instance in some bundler
  # environments (reproduced on Vercel's docusaurus/webpack build).
  '@tiptap/*': ^3.31.3
