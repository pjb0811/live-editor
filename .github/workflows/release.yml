name: Release (manual backfill)

# Optional utility: create/recreate a GitHub Release for an existing tag,
# reading the entry from CHANGELOG.md. publish.yml now creates the GitHub
# Release itself right after tagging, in the same job/token context — a tag
# pushed with the default GITHUB_TOKEN never triggers another workflow run,
# so a `push: tags` trigger here would never fire. This workflow is kept
# only as a manual fallback to (re)create a release for an existing tag,
# e.g. to backfill one that's missing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to create/recreate a GitHub Release for (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Get changelog entry
        id: changelog
        run: |
          VERSION=${{ github.event.inputs.tag }}
          VERSION=${VERSION#v}
          CHANGELOG_FILE="CHANGELOG.md"
          if [ -f "$CHANGELOG_FILE" ]; then
            # Can't use awk's `/start/,/end/` range here: the end pattern
            # (any "## " header) also matches the start line itself, so the
            # range would close immediately and yield nothing. Skip the
            # start header explicitly and exit before printing the next one.
            # changesets writes headers as "## VERSION" with no brackets
            # (older entries in this file predate the changesets migration
            # and still use "## [VERSION] - date" — the exit pattern below
            # matches either since it only checks the "## " prefix).
            CONTENT=$(awk -v version="$VERSION" '
              $0 ~ "^## " version "$" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$CHANGELOG_FILE")
            {
              echo "body<<EOF"
              echo "$CONTENT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          body: ${{ steps.changelog.outputs.body || format('Release {0}', github.event.inputs.tag) }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag, 'alpha') || contains(github.event.inputs.tag, 'beta') || contains(github.event.inputs.tag, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
