name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Dependency check
        run: pnpm run depcheck

      - name: Type check
        run: tsc -b

      - name: Test
        run: pnpm test

      - name: Install Chromium for browser regressions
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regressions
        run: pnpm test:browser

      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm run build

      - name: Check package types
        run: node .github/scripts/check-package-types.mjs

      - name: Check non-UI entries load in Node
        run: node .github/scripts/check-node-entries.mjs

      - name: Install website dependencies
        run: pnpm --dir website install

      - name: Type check website
        run: pnpm --dir website run typecheck

      - name: Build website
        run: pnpm --dir website build
