name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # v6+ is required for npm's OIDC "Trusted Publishing" used below.
      # No built-in `cache: 'pnpm'` here on purpose — this job skips
      # `pnpm install` whenever already_tagged is true (the common case
      # under changesets, since most main pushes are plain PR merges with
      # no version bump), and setup-node's post-job cache-save step errors
      # if the store directory it expects was never created. The cache
      # step below is scoped to the same already_tagged condition as
      # Install dependencies.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # package.json's version is untagged only right after a Version
      # Packages PR (opened on main by version.yml/changesets) has just
      # merged and landed a new version — that's the signal to actually
      # build/publish/tag. Otherwise this push is an ordinary main update
      # with nothing new to release.
      - name: Check if current version is already tagged
        id: tag_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get pnpm store directory
        if: steps.tag_check.outputs.already_tagged == 'false'
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        if: steps.tag_check.outputs.already_tagged == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.tag_check.outputs.already_tagged == 'false'
        run: pnpm install

      - name: Build
        if: steps.tag_check.outputs.already_tagged == 'false'
        run: pnpm run build

      # package.json currently has "private": true, so there is nothing to
      # publish to npm yet — flip that flag (and add publishConfig.access)
      # when this package is ready to go public. Tagging + the GitHub
      # Release below still happen either way, since those don't require
      # an npm registry entry.
      - name: Check if package is publishable
        id: publishable
        if: steps.tag_check.outputs.already_tagged == 'false'
        run: |
          IS_PRIVATE=$(node -p "require('./package.json').private === true")
          echo "is_private=$IS_PRIVATE" >> "$GITHUB_OUTPUT"

      # Uses npm's OIDC "Trusted Publishing" — no NPM_TOKEN needed. pnpm
      # publish doesn't support this yet, so this step shells out to npm
      # directly; the package itself is still built via pnpm above.
      - name: Publish to npm
        if: steps.tag_check.outputs.already_tagged == 'false' && steps.publishable.outputs.is_private == 'false'
        run: npm publish

      - name: Tag release
        if: steps.tag_check.outputs.already_tagged == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.tag_check.outputs.version }}"
          git push origin "v${{ steps.tag_check.outputs.version }}"

      # release.yml used to do this on tag push, but a tag pushed with the
      # default GITHUB_TOKEN (as above) never triggers another workflow run
      # — GitHub blocks that to prevent recursive runs — so it never fired.
      # Doing it here, in the same job/token context, sidesteps that
      # entirely instead of needing a separate PAT.
      - name: Get changelog entry
        if: steps.tag_check.outputs.already_tagged == 'false'
        id: changelog
        env:
          # Used by the release-note polishing step below. GH_MODELS_PAT/
          # GitHub Models is retired (2026-07-30) — see draft-changeset.mjs
          # for the same move to NVIDIA's API Catalog.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          VERSION=${{ steps.tag_check.outputs.version }}
          CHANGELOG_FILE="CHANGELOG.md"
          RAW=""
          if [ -f "$CHANGELOG_FILE" ]; then
            # Can't use awk's `/start/,/end/` range here: the end pattern
            # (any "## " header) also matches the start line itself, so the
            # range would close immediately and yield nothing. Skip the
            # start header explicitly and exit before printing the next one.
            # changesets writes headers as "## VERSION" with no brackets
            # (older entries in this file predate the changesets migration
            # and still use "## [VERSION] - date" — the exit pattern below
            # matches either since it only checks the "## " prefix).
            RAW=$(awk -v version="$VERSION" '
              $0 ~ "^## " version "$" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$CHANGELOG_FILE")
          fi

          CONTENT="$RAW"
          if [ -n "$RAW" ]; then
            # Best-effort: polish the raw changelog bullets into flowing
            # release notes via NVIDIA's API. Never blocks the release —
            # fall back to the raw changelog text on any failure.
            if POLISHED=$(echo "$RAW" | PACKAGE_NAME="@jbpark/live-editor" VERSION="$VERSION" node .github/scripts/polish-release-notes.mjs); then
              CONTENT="$POLISHED"
            else
              echo "::warning::Release-note polishing failed, falling back to raw changelog"
            fi
          fi

          # %0A/%0D/%25 escaping only applied to the old, deprecated
          # `::set-output` command syntax (which the runner auto-decoded).
          # The modern $GITHUB_OUTPUT file doesn't decode that, so it was
          # writing literal "%0A" text into the release body. Use the
          # heredoc form instead, which preserves real newlines as-is.
          {
            echo "body<<EOF"
            echo "$CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.already_tagged == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.tag_check.outputs.version }}
          body: ${{ steps.changelog.outputs.body || format('Release {0}', steps.tag_check.outputs.version) }}
          draft: false
          prerelease: ${{ contains(steps.tag_check.outputs.version, 'alpha') || contains(steps.tag_check.outputs.version, 'beta') || contains(steps.tag_check.outputs.version, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
